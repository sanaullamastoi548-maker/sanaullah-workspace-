<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanullah Workspace | Language Tool</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .language-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 45px 35px;
            max-width: 550px;
            width: 90%;
            margin: 30px auto;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .header h1 {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffcc00);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .tagline {
            font-size: 16px;
            color: #ccc;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .glow-line {
            width: 80px;
            height: 2px;
            background: #ffcc00;
            margin: 15px auto;
            border-radius: 5px;
        }

        .section-title {
            color: #ffcc00;
            font-size: 22px;
            margin: 25px 0 20px;
        }

        .search-box {
            margin-bottom: 25px;
        }

        #language-search {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #ffcc00;
            border-radius: 50px;
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            color: white;
            outline: none;
            text-align: center;
        }

        #language-search:focus {
            border-color: #fff;
            box-shadow: 0 0 12px rgba(255,204,0,0.4);
        }

        #language-search::placeholder {
            color: #aaa;
        }

        .translate-container {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 15px;
            margin: 20px 0;
        }

        .demo-text {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        .copy-btn {
            background: #ffcc00;
            color: black;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .copy-btn:hover {
            background: #ffaa00;
        }

        .copy-message {
            margin-top: 12px;
            font-size: 12px;
        }

        .powered {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }

        .powered span {
            color: #ffcc00;
        }
    </style>
</head>
<body>

<div class="language-card">
    <div class="header">
        <h1>Sanullah Workspace</h1>
        <div class="glow-line"></div>
        <div class="tagline">کی مدد سے AI ، بر مشکل کام کا آسان حل</div>
    </div>

    <div class="section-title">🌐 اپنی زبان تلاش کریں</div>

    <div class="search-box">
        <input type="text" id="language-search" placeholder="مثلاً: Urdu, Arabic, English...">
    </div>

    <div class="translate-container">
        <div id="google_translate_element"></div>
    </div>

    <div class="demo-text">
        <p>✨ یہ ایک نمونہ متن ہے۔ جب آپ Google Translate سے کوئی زبان منتخب کریں گے، تو یہ پورا صفحہ اسی زبان میں ترجمہ ہو جائے گا۔</p>
        <button class="copy-btn" onclick="copyDemoText()">📋 کاپی کریں / Copy</button>
        <div id="copyMessage" class="copy-message"></div>
    </div>

    <div class="powered">
        <span>🔍</span> Powered by <span>Google Translate</span>
    </div>
</div>

<script>
    // ========== GOOGLE TRANSLATE INIT ==========
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ur',
            autoDisplay: false,
            includedLanguages: 'ur,en,ar,hi,es,fr,de,tr,fa,bn,ru'
        }, 'google_translate_element');
    }

    // ========== SEARCH FUNCTION ==========
    function filterLanguages() {
        let input = document.getElementById('language-search').value.toLowerCase();
        let select = document.querySelector('.goog-te-combo');
        if (select) {
            for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].text.toLowerCase().indexOf(input) > -1) {
                    select.selectedIndex = i;
                    select.dispatchEvent(new Event('change'));
                    break;
                }
            }
        }
    }

    // Trigger search on input
    document.getElementById("language-search").addEventListener("keyup", filterLanguages);

    // ========== COPY FUNCTION ==========
    function copyDemoText() {
        let text = document.querySelector('.demo-text p').innerText;
        let temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        let success = false;
        try {
            success = document.execCommand("copy");
        } catch(e) {}
        document.body.removeChild(temp);
        
        let msgDiv = document.getElementById("copyMessage");
        if (success) {
            msgDiv.innerHTML = "✅ متن کامیابی سے کاپی ہو گیا!";
            msgDiv.style.color = "#00ff88";
        } else {
            msgDiv.innerHTML = "❌ کاپی کرنے میں مسئلہ۔";
            msgDiv.style.color = "#ff6666";
        }
        setTimeout(() => {
            msgDiv.innerHTML = "";
        }, 3000);
    }
</script>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
