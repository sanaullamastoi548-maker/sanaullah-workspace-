<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanaullah Workspace | Language & Search Tool</title>
    
    <style>
        /* ویب سائٹ کا مکمل ڈیزائن */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: white;
        }
        
        /* Header */
        .header {
            background: rgba(44, 62, 80, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 40px 30px;
            text-align: center;
            border-bottom: 2px solid #ffcc00;
        }
        .header h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffcc00);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .header p {
            font-size: 18px;
            margin-top: 10px;
            opacity: 0.9;
        }
        
        /* Language Section */
        .language-section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            padding: 35px 25px;
            text-align: center;
            border-bottom: 2px solid #ffcc00;
            max-width: 700px;
            margin: 40px auto;
            border-radius: 28px;
        }
        .language-section h3 {
            color: #ffcc00;
            font-size: 26px;
            margin-bottom: 20px;
        }
        
        #language-search {
            padding: 14px 20px;
            width: 80%;
            min-width: 250px;
            border: 2px solid #ffcc00;
            border-radius: 50px;
            font-size: 16px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            outline: none;
            text-align: center;
        }
        #language-search:focus {
            border-color: #fff;
            box-shadow: 0 0 12px rgba(255,204,0,0.4);
        }
        #language-search::placeholder {
            color: #aaa;
        }
        
        /* Google Translate Container */
        .translate-container {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
        }
        
        /* Demo Text */
        .demo-text {
            text-align: center;
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            backdrop-filter: blur(8px);
            line-height: 1.8;
        }
        
        .copy-btn {
            background: #ffcc00;
            color: black;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .copy-btn:hover {
            background: #ffaa00;
            transform: scale(0.97);
        }
        
        .copy-message {
            margin-top: 12px;
            font-size: 12px;
        }
        
        footer {
            text-align: center;
            padding: 30px;
            margin-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            opacity: 0.7;
        }
        footer span {
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>Sanaullah Workspace</h1>
        <p>ہر مشکل کام کا آسان حل، AI کی مدد سے</p>
    </div>

    <!-- Language Section (صرف زبان اور سرچ) -->
    <div class="language-section">
        <h3>🌐 اپنی زبان تلاش کریں</h3>
        <input type="text" id="language-search" placeholder="مثلاً: Urdu, Arabic, English..." onkeyup="filterLanguages()">
        <div class="translate-container">
            <div id="google_translate_element"></div>
        </div>
        <p style="font-size: 12px; margin-top: 12px; opacity: 0.6;">👇 نیچے والے باکس سے اپنی زبان منتخب کریں</p>
    </div>

    <!-- Demo Text (ترجمہ دیکھنے کے لیے) -->
    <div class="demo-text">
        <p>✨ یہ ایک نمونہ متن ہے۔ جب آپ Google Translate سے کوئی زبان منتخب کریں گے، تو یہ پورا صفحہ اسی زبان میں ترجمہ ہو جائے گا۔</p>
        <button class="copy-btn" onclick="copyDemoText()">📋 کاپی کریں / Copy</button>
        <div id="copyMessage" class="copy-message"></div>
    </div>

    <footer>
        <span>🔍</span> Powered by <span>Google Translate</span>
    </footer>

    <script>
        // ========== GOOGLE TRANSLATE INIT ==========
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ur',
                autoDisplay: false,
                includedLanguages: 'ur,en,ar,hi,es,fr,de,tr,fa,bn,ru'
            }, 'google_translate_element');
        }

        // ========== SEARCH FUNCTION ==========
        function filterLanguages() {
            let input = document.getElementById('language-search').value.toLowerCase();
            let select = document.querySelector('.goog-te-combo');
            if (select) {
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].text.toLowerCase().indexOf(input) > -1) {
                        select.selectedIndex = i;
                        select.dispatchEvent(new Event('change'));
                        break;
                    }
                }
            }
        }

        // ========== COPY FUNCTION ==========
        function copyDemoText() {
            let text = document.querySelector('.demo-text p').innerText;
            let temp = document.createElement("textarea");
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            let success = false;
            try {
                success = document.execCommand("copy");
            } catch(e) {}
            document.body.removeChild(temp);
            
            let msgDiv = document.getElementById("copyMessage");
            if (success) {
                msgDiv.innerHTML = "✅ متن کامیابی سے کاپی ہو گیا!";
                msgDiv.style.color = "#00ff88";
                msgDiv.style.background = "rgba(0,255,100,0.15)";
                msgDiv.style.padding = "8px";
                msgDiv.style.borderRadius = "20px";
            } else {
                msgDiv.innerHTML = "❌ کاپی کرنے میں مسئلہ۔ براہ کرم دستی طور پر کاپی کریں۔";
                msgDiv.style.color = "#ff6666";
                msgDiv.style.background = "rgba(255,50,50,0.15)";
                msgDiv.style.padding = "8px";
                msgDiv.style.borderRadius = "20px";
            }
            setTimeout(() => {
                msgDiv.innerHTML = "";
                msgDiv.style.padding = "0";
            }, 3000);
        }
    </script>
    
    <!-- Google Translate Script -->
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
